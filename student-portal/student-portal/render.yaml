services:
  - type: web
    name: student-registration-portal
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # To use Render PostgreSQL instead of SQLite:
      # 1. Create a PostgreSQL database on Render
      # 2. Uncomment the lines below and set fromDatabase
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: student-portal-db
      #     property: connectionString

# Optional: uncomment to auto-provision a free Postgres database
# databases:
#   - name: student-portal-db
#     plan: free
