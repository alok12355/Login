<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #06b6d4;
    --bg: #f4f6fb;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f4f6fb 40%, #ecfeff 100%);
    color: var(--text);
    min-height: 100vh;
  }
  .navbar {
    background: linear-gradient(90deg, var(--primary), var(--accent));
    color: #fff;
    padding: 22px 30px;
  }
  .navbar h1 { margin: 0; font-size: 24px; }
  .container {
    max-width: 600px;
    margin: 30px auto;
    padding: 0 20px 60px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(31,41,55,0.08);
    padding: 26px;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    background: #fafbff;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--primary-dark);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="navbar">
  <h1>✏️ Edit Student Record</h1>
</div>

<div class="container">
  <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Portal</a>
  <div class="card">
    <form action="{{ url_for('edit_student', student_id=student.id) }}" method="POST">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" value="{{ student.name }}" required>
      </div>

      <div class="row2">
        <div class="form-group">
          <label>Age *</label>
          <input type="number" name="age" value="{{ student.age }}" min="1" max="100" required>
        </div>
        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" name="dob" value="{{ student.dob }}" required>
        </div>
      </div>

      <div class="row2">
        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="" {% if not student.gender %}selected{% endif %}>Select</option>
            <option value="Male" {% if student.gender=='Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender=='Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if student.gender=='Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Study Year *</label>
          <select name="year" required>
            <option value="1st Year" {% if student.year=='1st Year' %}selected{% endif %}>1st Year</option>
            <option value="2nd Year" {% if student.year=='2nd Year' %}selected{% endif %}>2nd Year</option>
            <option value="3rd Year" {% if student.year=='3rd Year' %}selected{% endif %}>3rd Year</option>
            <option value="4th Year" {% if student.year=='4th Year' %}selected{% endif %}>4th Year</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Course / Branch</label>
        <input type="text" name="course" value="{{ student.course or '' }}">
      </div>

      <div class="row2">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ student.email or '' }}">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" value="{{ student.phone or '' }}">
        </div>
      </div>

      <div class="form-group">
        <label>Address *</label>
        <textarea name="address" required>{{ student.address }}</textarea>
      </div>

      <button type="submit" class="btn">Update Student ✅</button>
    </form>
  </div>
</div>

</body>
</html>
